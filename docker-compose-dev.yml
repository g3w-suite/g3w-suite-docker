## HOW TO RUN: ##
#
# docker compose -f docker-compose.yml -f docker-compose-dev.yml up -d
#

services:

  postgis:
    restart: "no" # disable autorestart
    volumes:
      - g3wsuite-pg-data:/var/lib/postgresql
    networks:
      internal:

  g3w-suite:
    environment:
      - BITBUCKET_TOKEN
      - G3WSUITE_DEBUG=${G3WSUITE_DEBUG:-True}
      - G3WSUITE_GUNICORN_NUM_WORKERS=${G3WSUITE_GUNICORN_NUM_WORKERS:-1}
      - WEBGIS_PUBLIC_HOSTNAME=${WEBGIS_PUBLIC_HOSTNAME:-localhost}
      - WEBGIS_ADMIN_EMAIL=${WEBGIS_ADMIN_EMAIL:-info@gis3w.it}
      # hotfix for Python 11: https://stackoverflow.com/a/76469774
      - PIP_BREAK_SYSTEM_PACKAGES=1
      - PIP_ROOT_USER_ACTION=ignore
      # hotfix for Ubuntu Jammy: https://github.com/pypa/setuptools/issues/3269#issuecomment-1254507377
      - DEB_PYTHON_INSTALL_LAYOUT=deb_system
    stdin_open: true
    tty: true

    ports:
      - "8000:8000"
    restart: "no" # disable autorestart
    volumes:
      - ./scripts:/scripts
      - ${G3WSUITE_LOCAL_CODE_PATH}:/code
    entrypoint: ["/bin/bash", "-c", "/scripts/docker-entrypoint.sh"]

  g3w-suite-consumer:
    deploy:
      replicas: 0  # 0 = disable g3w-suite-consumer service

  nginx:
    deploy:
      replicas: 0  # 0 = disable nginx service

  certbot:
    deploy:
      replicas: 0  # 0 = disable certbot service

volumes:
  shared-volume:
  g3wsuite-pg-data:

networks:
  internal:
