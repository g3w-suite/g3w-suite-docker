name: Build and push devcontainer image

on:
  push:
    branches:
      - "**"

jobs:
  prebuild:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push devcontainer image
        uses: devcontainers/ci@v0.3
        env:
          # Suppress the interactive prompt that devcontainers/ci may trigger
          BUILDKIT_PROGRESS: plain
        with:
          imageName: ghcr.io/${{ github.repository }}/devcontainer
          # Tag with the sanitized branch name so each branch has its own image.
          imageTag: ${{ github.ref_name }}
          # Reuse layers from the previously published image to speed up builds.
          # On the very first build this image won't exist yet; devcontainers/ci
          # handles that gracefully and proceeds without cache.
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer:${{ github.ref_name }}
          push: always
