name: G3W-SUITE-DOCKER Makefile tests

on:
  pull_request:
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ##
  # Verify the Makefile is parseable and all targets are listed correctly.
  ##
  validate-makefile:
    name: "Validate Makefile (make help)"
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: make help
        run: make help

  ##
  # Verify docker-compose.yml interpolates without errors against .env.example.
  ##
  validate-compose:
    name: "Validate docker-compose.yml syntax"
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Create .env from .env.example
        run: cp .env.example .env
      -
        name: "docker compose config (prod)"
        run: docker compose --env-file .env -f docker-compose.yml config --quiet
      -
        name: "docker compose config (dev)"
        run: docker compose --env-file .env --env-file .env.dev -f docker-compose.yml config --quiet

  ##
  # Build image targets via docker buildx bake.
  ##
  build:
    name: "docker buildx bake ci"
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4
      -
        name: "Build ci matrix"
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: ci
          set: |
            *.cache-from=type=gha,scope=ci
            *.cache-to=type=gha,mode=max,scope=ci
            ci-deps-ltr-oracle.output=type=docker,dest=ci-deps-ltr-oracle.tar
      -
        name: "Upload ci-deps-ltr-oracle artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ci-deps-ltr-oracle
          if-no-files-found: error
          path: ci-deps-ltr-oracle.tar
          retention-days: 7
