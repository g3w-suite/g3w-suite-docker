name: G3W-SUITE-DOCKER Makefile tests

on:
  push:
  pull_request:
  schedule:
    # Every night at 02:00 UTC.
    - cron: '0 2 * * *'

jobs:

  ##
  # Verify the Makefile is parseable and all targets are listed correctly.
  ##
  validate-makefile:
    name: "Validate Makefile (make help)"
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: make help
        run: make help

  ##
  # Verify docker-compose.yml interpolates without errors against .env.example.
  ##
  validate-compose:
    name: "Validate docker-compose.yml syntax"
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Create .env from .env.example
        run: cp .env.example .env
      -
        name: "docker compose config (prod)"
        run: docker compose --env-file .env -f docker-compose.yml config --quiet
      -
        name: "docker compose config (dev)"
        run: docker compose --env-file .env --env-file .env.dev -f docker-compose.yml config --quiet

  ##
  # Build image targets via docker buildx bake.
  ##
  build:
    name: "docker buildx bake ci"
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
      -
        name: "Build ci matrix"
        run: docker buildx bake -f docker-bake.hcl ci

  ##
  # Build QGIS Server with Oracle support.
  # Only runs at night (schedule) — compilation takes ~1-2 hours.
  ##
  build-oracle:
    name: "docker buildx bake oracle"
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule'
    concurrency:
      group: build-oracle
      cancel-in-progress: false
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: "Build qgis-oracle"
        run: |
          docker buildx bake -f docker-bake.hcl \
            oracle \
            --set *.cache-from=type=gha,scope=qgis-oracle \
            --set *.cache-to=type=gha,mode=max,scope=qgis-oracle
