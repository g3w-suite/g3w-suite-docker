##
# DOCKER BUILD: Dockerfile (stage: deps + suite)
##

name: Build and push G3W-SUITE images

on:
  push:
    branches:
      - dev
  schedule:
    - cron: "0 2 * * *"  # deps-ltr
    - cron: "0 4 * * *"  # suite
  workflow_dispatch:
    inputs:
      target:
        description: "Stage to build (deps-ltr | suite | both)"
        default: "both"
        required: true
        type: choice
        options: [deps-ltr, suite, both]

jobs:

  build-deps-ltr:
    name: "Build deps-ltr image"
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' && (inputs.target == 'deps-ltr' || inputs.target == 'both') ||
      github.event_name == 'schedule' && github.event.schedule == '0 2 * * *'
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Extract branch name
        shell: bash
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//_/g')" >> $GITHUB_ENV
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      -
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          target: deps
          push: true
          tags: g3wsuite/g3w-suite-deps-ltr:${{ env.BRANCH_NAME }}
      -
        name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  build-suite:
    name: "Build suite image"
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' && (inputs.target == 'suite' || inputs.target == 'both') ||
      github.event_name == 'schedule' && github.event.schedule == '0 4 * * *'
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Extract branch name
        shell: bash
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//_/g')" >> $GITHUB_ENV
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      -
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          target: suite
          push: true
          tags: g3wsuite/g3w-suite:${{ env.BRANCH_NAME }}
      -
        name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
