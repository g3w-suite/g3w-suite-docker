name: G3W-SUITE-DOCKER build tests

on: [push, pull_request]

jobs:

  build:
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v2
      -
        name: Extract branch name
        shell: bash
        run: echo "::set-env name=BRANCH_NAME::$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//_/g')"
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      -
        name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1
      -
        name: Build deps image
        id: docker_build_deps
        uses: docker/build-push-action@v2
        with:
          context: ./
          file: ./Dockerfile.g3wsuite-deps.ltr.dockerfile
          push: false
          tags: g3wsuite/g3w-suite-deps-ltr:${{ env.BRANCH_NAME }}

      -
        name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      - name: Build main image
        id: docker_build_main
        uses: docker/build-push-action@v2
        with:
          context: ./
          file: ./Dockerfile.g3wsuite.dockerfile
          push: false
          tags: g3wsuite/g3w-suite:${{ env.BRANCH_NAME }}