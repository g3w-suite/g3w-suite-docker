##
# DOCKER BUILD: Dockerfile.g3wsuite-deps.ltr.dockerfile
##

name: Build G3W-SUITE LTR/LATEST dependencies

on:
  push:
    branches:
      - dev
  schedule:
    - cron: "0 2 * * *"

jobs:

  build:
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v2
      -
        name: Extract branch name
        shell: bash
        run: echo "::set-env name=BRANCH_NAME::$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//_/g')"
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true  
      -
        name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1
      -
        name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      -
        name: Build and push LATEST
        id: docker_build_latest
        uses: docker/build-push-action@v2
        with:
          context: ./
          file: ./Dockerfile.g3wsuite-deps.dockerfile
          push: true
          tags: g3wsuite/g3w-suite-deps:${{ env.BRANCH_NAME }}

      -
        name: Build and push LTR
        id: docker_build_ltr
        uses: docker/build-push-action@v2
        with:
          context: ./
          file: ./Dockerfile.g3wsuite-deps.ltr.dockerfile
          push: true
          tags: g3wsuite/g3w-suite-deps-ltr:${{ env.BRANCH_NAME }}

      -
        name: Image digest
        run: |
          echo ${{ steps.docker_build_latest.outputs.digest }}
          echo ${{ steps.docker_build_ltr.outputs.digest }}
