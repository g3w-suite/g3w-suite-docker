services:
  elasticsearch-init:
    image: busybox
    user: root
    command: ["sh", "-c", "chown -R 1000:0 /data && chmod -R 777 /data"]
    volumes:
      - ${WEBGIS_DOCKER_SHARED_VOLUME}/esdata:/data
    restart: "no"
    networks:
      internal:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.14
    user: "1000:0"
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TAKE_FILE_OWNERSHIP=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ${WEBGIS_DOCKER_SHARED_VOLUME}/esdata:/usr/share/elasticsearch/data
    networks:
      internal: